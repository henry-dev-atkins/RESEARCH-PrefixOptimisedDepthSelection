experiment:
  name: mnli_bert_base_full
  seed: 7
  output_dir: pods/results/raw/mnli_bert_base_full
  tags:
  - session6
  - glue
  - mnli
  - bert-base
  - full
  quality_bootstrap_samples: 0
  confidence_level: 0.95
task:
  type: text_classification
  dataset: mnli
  num_classes: 3
  selection_fraction: 0.1
  text_fields:
  - premise
  - hypothesis
  max_length: 128
  metric_name: accuracy
model:
  family: bert
  candidate_depths:
  - 2
  - 4
  - 6
  - 8
  - 10
  - 12
  head_type: bert_cls
  norm_type: none
  input_shape: null
  hidden_dims: []
  channels: []
  groupnorm_groups: 8
  variant: null
  pretrained_model_name: bert-base-uncased
  dropout: 0.1
training:
  mode: full_only
  epochs: 3
  batch_size: 16
  optimiser: adamw
  learning_rate: 2.0e-05
  weight_decay: 0.01
  grad_clip: 1.0
  mixed_precision: bf16
  weight_power: 1.0
  num_middle_depths: 0
  scheduler: cosine
  scheduler_t_max: 3
  scheduler_milestones: []
  scheduler_gamma: null
  label_smoothing: 0.0
  momentum: 0.9
  num_workers: 0
  pin_memory: true
  persistent_workers: false
  drop_last: false
  gradient_accumulation_steps: 2
  warmup_ratio: 0.1
  max_train_steps: null
  layerdrop_prob: 0.0
  progressive_middle_depths: []
selection:
  quality_metric: accuracy
  cost_metric: latency_ms_p50
  target_kind: relative
  relative_accuracy_drop: 0.01
  absolute_accuracy_target: null
benchmark:
  batch_sizes:
  - 1
  - 8
  selection_batch_size: 1
  warmup_steps: 10
  timed_steps: 30
  repeat_runs: 1
baseline:
  kind: full
  target_depth: null
  head_fit_epochs: 3
  head_fit_learning_rate: 0.001
  distillation_alpha: 0.5
  distillation_temperature: 2.0
