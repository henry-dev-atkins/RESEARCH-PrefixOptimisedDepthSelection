
experiment:
  name: test
  seed: 1
  output_dir: temp/test

task:
  type: text_regression
  dataset: stsb
  num_classes: 1
  selection_fraction: 0.1
  text_fields: [sentence1, sentence2]
  max_length: 128
  metric_name: spearman_correlation

model:
  family: bert
  pretrained_model_name: bert-base-uncased
  candidate_depths: [2,4,6,8,10,12]
  head_type: bert_cls
  norm_type: none
  dropout: 0.1

training:
  mode: full_only
  epochs: 1
  batch_size: 2
  optimiser: adamw
  learning_rate: 0.001
  weight_decay: 0.0
  grad_clip: 1.0
  mixed_precision: none
  weight_power: 1.0
  num_middle_depths: 0
  scheduler: none

selection:
  quality_metric: spearman_correlation
  cost_metric: latency_ms_p50
  relative_accuracy_drop: 0.01
  absolute_accuracy_target: null

benchmark:
  batch_sizes: [1,2]
  selection_batch_size: 2
  warmup_steps: 1
  timed_steps: 2

baseline:
  kind: distilled_shallow
  target_depth: 2
  teacher_output_dir: pods/results/raw/sst2_bert_base_full
