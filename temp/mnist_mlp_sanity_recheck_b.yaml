experiment:
  name: mnist_mlp_sanity_recheck_b
  seed: 7
  output_dir: pods/results/raw/mnist_mlp_sanity_recheck_b
  tags: [milestone1, mnist, mlp, sanity, recheck_b]

task:
  type: image_classification
  dataset: mnist
  num_classes: 10

model:
  family: mlp
  input_shape: [1, 28, 28]
  hidden_dims: [128, 128, 64]
  candidate_depths: [1, 2, 3]
  head_type: linear
  norm_type: none

training:
  mode: sandwich
  epochs: 5
  batch_size: 128
  optimiser: adamw
  learning_rate: 0.001
  weight_decay: 0.0001
  grad_clip: 1.0
  mixed_precision: none
  weight_power: 1.0
  num_middle_depths: 1

selection:
  quality_metric: accuracy
  cost_metric: latency_ms_p50
  relative_accuracy_drop: 0.01
  absolute_accuracy_target: null

benchmark:
  batch_sizes: [1, 64]
  selection_batch_size: 64
  warmup_steps: 5
  timed_steps: 20

baseline:
  kind: pods
  target_depth: null
  head_fit_epochs: 3
  head_fit_learning_rate: 0.001
